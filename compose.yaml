name: mcp-nas

services:
  # Only component with access to the Docker socket. It only allows GET on
  # containers, images and networks (POST=0): nothing can be stopped or created.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    container_name: mcp-nas-docker-proxy
    restart: unless-stopped
    # HAProxy 3.x needs more than 1024 file descriptors; on ADM the default limit
    # is 1024 and the worker fails to start ("Cannot raise FD limit").
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

  mcp-nas:
    build: .
    image: mcp-nas:0.3.0
    container_name: mcp-nas
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    depends_on: [docker-socket-proxy]
    environment:
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
      MCP_PORT: "8088"
      DOCKER_HOST: http://docker-socket-proxy:2375
      NAS_CONF: /host/nas.conf
      FILE_ROOTS: ${FILE_ROOTS:-}
      STORAGE_PATHS: ${STORAGE_PATHS:-}
      MD_WATCH: ${MD_WATCH:-md1}
      MD_LABELS: ${MD_LABELS:-}
      NAS_NOTES: ${NAS_NOTES:-}
    volumes:
      # Exposed data (read-only, names and metadata only).
      - /archive1:/archive1:ro
      - /archive2:/archive2:ro
      # Empty folder used only to measure volume1 usage (statvfs).
      - ${DOCKER_ROOT:-/volume1/Docker}/mcp-nas/vol1:/mnt/volume1:ro
      - /etc/nas.conf:/host/nas.conf:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8088/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - socket
      - proxy   # NPM publishes the MCP by container name
    # By default it only listens on the host's localhost. To use it from another
    # machine, set the NAS LAN (or Tailscale) IP in MCP_BIND_IP in .env.
    # Never 0.0.0.0 or the public IP.
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:8088:8088"

networks:
  socket:
    internal: true   # the socket proxy does not need internet access
  proxy:
    external: true
    name: proxy
